<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>まぐろ船追跡</title>

<style>
body{
font-family:sans-serif;
padding:20px;
}

input,button{
font-size:18px;
padding:10px;
width:100%;
margin-top:10px;
}

#result{
margin-top:20px;
}
</style>

</head>

<body>

<h2>🐟 まぐろ船追跡</h2>

<select id="ship">

<option>第八市栄丸</option>
<option>KOEI MARU NO 31</option>
<option>第十八福吉丸</option>

</select>

<button onclick="search()">検索</button>

<div id="result"></div>

<script>

function search(){

let ship=document.getElementById("ship").value;

if(ship==""){
document.getElementById("result").innerHTML="船名を入力してください";
return;
}

document.getElementById("result").innerHTML=
"船名："+ship+"<br>"+
"現在位置：取得予定<br>"+
"入港予測：計算予定";

}

</script>

</body>
</html>
