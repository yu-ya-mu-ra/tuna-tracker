<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>まぐろ船トラッカー</title>

<style>

body{
font-family:sans-serif;
padding:20px;
background:#f2f2f2;
}

h1{
font-size:22px;
}

input,button{
font-size:18px;
padding:10px;
width:100%;
margin-top:10px;
}

.ship{
background:white;
padding:15px;
margin-top:10px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

</style>
</head>

<body>

<h1>🐟 まぐろ船トラッカー</h1>

<input id="shipInput" placeholder="船名を入力">

<button onclick="addShip()">追跡追加</button>

<div id="ships"></div>

<script>

let ships=[];

const ports=[
"気仙沼",
"塩竈",
"銚子",
"勝浦",
"焼津",
"那智勝浦",
"三崎",
"宮崎",
"長崎",
"鹿児島"
];

function addShip(){

let name=document.getElementById("shipInput").value;

if(name=="") return;

ships.push({
name:name,
port:randomPort(),
position:randomPos()
});

document.getElementById("shipInput").value="";

render();

}

function randomPort(){

return ports[Math.floor(Math.random()*ports.length)];

}

function randomPos(){

let lat=(30+Math.random()*10).toFixed(2);

let lon=(135+Math.random()*10).toFixed(2);

return lat+"N "+lon+"E";

}

function render(){

let html="";

ships.forEach(s=>{

html+=`

<div class="ship">

<b>${s.name}</b><br><br>

現在位置<br>
${s.position}<br><br>

入港予測<br>
${s.port}

</div>

`;

});

document.getElementById("ships").innerHTML=html;

}

</script>

</body>
</html>
